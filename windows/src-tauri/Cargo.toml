[package]
name = "glim"
description = "Glim — a local-only companion at the top of your screen"
authors = ["Louis Raille", "Anthony Garcia"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "glim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
# The instant writing checker (src/writing/): local, no network crates in
# its tree (checked 2026-10-10). Pinned; no thesaurus.
harper-core = { version = "=2.11.0", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }
# Only src/net/ may use it (the network choke point; a test enforces this).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
# The island's file drop reads paths straight from WebView2 (webview_drop.rs).
# Same versions as wry, so nothing new is compiled.
webview2-com = "0.39"
wv2_core = { package = "windows-core", version = "0.62" }
# `#[implement]` (COM event handlers, src/capture/uia.rs) expands to paths in
# windows-core, so it is a direct dependency; same version windows 0.61 uses.
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  # "Open terminal": the relay's process tree leads to the session's window.
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # Fullscreen detection (presence.rs): SHQueryUserNotificationState.
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The GTK that Tauri already runs on, to reach its window for layer-shell and
# the input region. libgtk-layer-shell itself is called directly (platform/linux.rs).
gtk = "0.18"
