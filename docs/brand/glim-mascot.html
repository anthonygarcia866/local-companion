<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Glim mascot (approved)</title>
<!--
Glim mascot - approved design, reference implementation. Source of truth.
- One SVG; state = one class on the <svg>: s-idle, s-listen, s-think, s-suggest, s-record, s-paused, s-delegate, s-done, s-error
- RED IS RESERVED FOR s-record (screen recording). No other app state may map to s-record.
- s-delegate is reserved for Phase 3 (data leaving the machine after approval). Do not use it for "finished"; use s-done.
- s-error = dim, droopy, worried brows, sweat drop. Never red.
- Add class "compact" for sizes under 48px (hides ribs, embers, face details, hands, brows; enlarges eyes; wider listen glance).
- The "aura" and "twinkles" groups (ribbons + sparkles) are for large/icon contexts only; remove them in the notch sprite.
- Respects prefers-reduced-motion.
-->
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:radial-gradient(circle at 50% 45%,#1e3452,#0c111c);font-family:system-ui,sans-serif}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;padding:8px 14px;border-radius:999px;border:1px solid #9a6a48;background:#16181f;color:#ede6da;cursor:pointer}

.lantern{display:block;overflow:visible}
.lantern .ring,.lantern .spark,.lantern .lift{opacity:0}
.lantern .eye,.lantern .eyes,.lantern .ring,.lantern .spark,.lantern .lift{transform-box:fill-box;transform-origin:center}
.lantern .flame-g{transform-box:fill-box;transform-origin:50% 100%}
.s-idle .glow{animation:breathe 3.6s ease-in-out infinite}
.s-idle .eye{transform:scaleY(.35)}
.s-idle .tone{filter:brightness(.85)}
@keyframes breathe{0%,100%{opacity:.22}50%{opacity:.55}}
.s-listen .glow{opacity:.9}
.s-think .flame-g{animation:sway 1.6s ease-in-out infinite}
.s-think .eyes{transform:translateY(-2px)}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.s-suggest .glow{animation:flare 2.4s ease-in-out infinite}
.s-suggest .spark{animation:rise 2.4s ease-out infinite}
@keyframes flare{0%,100%{opacity:.8}30%{opacity:1}}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(16px,-28px)}}
.s-record .tone,.s-record .glow{filter:hue-rotate(-40deg) saturate(1.6)}
.s-record .glow{opacity:1}
.s-record .ring{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.88)}100%{opacity:0;transform:scale(1.18)}}
.s-paused .tone,.s-paused .hw{filter:grayscale(1) brightness(.55)}
.s-paused .glow,.s-paused .flame-g,.s-paused .embers{opacity:0}
.s-delegate .lift{animation:lift 2.6s ease-in infinite}
@keyframes lift{0%{opacity:0;transform:translateY(8px)}25%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.compact .ribs-h,.compact .embers{display:none}
.lantern .eyes-wrap,.lantern .brow{transform-box:fill-box;transform-origin:center}
.compact .eyes-wrap{transform:scale(1.5)}
.compact .brows{display:none}
.compact .ribs-v{stroke-width:3.4}
.lantern .hl{fill:#ffffff}
.lantern .hand{transform-box:fill-box;transform-origin:center;transition:transform .35s ease}
.compact .hands{display:none}
.lantern .hand{opacity:0;transition:transform .35s ease,opacity .25s ease}
.s-think .hand-r,.s-suggest .hand-r,.s-delegate .hand{opacity:1}
.s-think .hand-r{transform:translate(-12px,4px) rotate(-35deg)}
.s-think .eyes{transform:translate(-1.5px,-2px)}
.s-suggest .hand-r{transform:translate(2px,-17px) rotate(25deg)}
.s-delegate .hand-l{transform:translate(9px,-24px) rotate(-25deg)}
.s-delegate .hand-r{transform:translate(-9px,-24px) rotate(25deg)}
.lantern .brows,.lantern .happy{opacity:0;transition:opacity .25s ease}
.lantern .brow{transition:transform .3s ease}
.s-idle .eye{animation:doze 3.6s ease-in-out infinite}
@keyframes doze{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(.16)}}
.s-listen .eyes{animation:glance 5s ease-in-out infinite}
@keyframes glance{0%,40%{transform:translateX(0) scaleY(1)}48%{transform:translateX(-1.4px) scaleY(1)}68%{transform:translateX(1.2px) scaleY(1)}86%{transform:translateX(0) scaleY(1)}90%{transform:translateX(0) scaleY(.1)}94%,100%{transform:translateX(0) scaleY(1)}}
.s-think .eyes{animation:ponder 3.2s ease-in-out infinite}
@keyframes ponder{0%,100%{transform:translate(-1.6px,-2px) scaleY(1)}45%{transform:translate(1.4px,-2.6px) scaleY(1)}50%{transform:translate(1.4px,-2.6px) scaleY(.15)}56%{transform:translate(1.4px,-2.6px) scaleY(1)}}
.s-think .brows{opacity:1}
.s-think .brow-r{transform:translateY(-1.4px) rotate(-10deg)}
.s-think .brow-l{transform:translateY(.4px) rotate(6deg)}
.s-suggest .eyes{animation:excite 2.4s ease-out infinite}
@keyframes excite{0%{transform:translate(0,0) scale(1)}15%{transform:translate(1px,-1.5px) scale(1.2)}30%,80%{transform:translate(1px,-1.5px) scale(1.1)}85%{transform:translate(1px,-1.5px) scale(1.1,.15)}90%,100%{transform:translate(1px,-1.5px) scale(1.1)}}
.s-suggest .brows{opacity:1}
.s-suggest .brow{transform:translateY(-1.8px)}
.s-record .eye{transform:scaleY(.75)}
.s-record .eyes{animation:focusblink 6s ease-in-out infinite}
@keyframes focusblink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
.s-record .brows{opacity:1}
.s-record .brow-l{transform:translateY(.8px) rotate(12deg)}
.s-record .brow-r{transform:translateY(.8px) rotate(-12deg)}
.s-delegate .eye,.s-delegate .hl{opacity:0}
.s-delegate .happy{opacity:1}
.s-idle .hl{opacity:0}
.compact .hl,.compact .face,.compact .core{display:none}
.aura{transform-origin:50px 64px;animation:drift 9s ease-in-out infinite}
@keyframes drift{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-2px)}}
.tw{animation:twinkle 2.8s ease-in-out infinite}
.tw2{animation-delay:.7s}.tw3{animation-delay:1.4s}.tw4{animation-delay:2.1s}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.mote{transform-box:fill-box;animation:float 5s ease-in-out infinite}
.m2{animation-delay:1.6s}.m3{animation-delay:3.2s}
@keyframes float{0%{opacity:0;transform:translateY(6px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.lantern .drop{opacity:0;transform-box:fill-box;transform-origin:50% 0}
.s-error .tone{filter:saturate(.55) brightness(.8)}
.s-error .glow{opacity:.3}
.s-error .flame-g{animation:lantern-shiver 2.2s ease-in-out infinite}
@keyframes lantern-shiver{0%,100%{transform:scale(1,.86)}50%{transform:scale(.97,.82)}}
.s-error .eye{transform:scale(.85,.8)}
.s-error .brows{opacity:1}
.s-error .brow-l{transform:translateY(-1.2px) rotate(-14deg)}
.s-error .brow-r{transform:translateY(-1.2px) rotate(14deg)}
.s-error .drop{animation:lantern-sweat 2.6s ease-in infinite}
@keyframes lantern-sweat{0%{opacity:0;transform:translateY(-2px)}20%{opacity:1}75%{opacity:1;transform:translateY(5px)}100%{opacity:0;transform:translateY(7px)}}
.s-done .glow{opacity:1}
.s-done .eye,.s-done .hl{opacity:0}
.s-done .happy{opacity:1}
.s-done .flame-g{animation:lantern-hop 1.3s ease-in-out infinite}
@keyframes lantern-hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-3px) scale(1.03,.97)}60%{transform:translateY(0) scale(.98,1.03)}}
.compact.s-listen .eyes{animation-name:glance-c}
@keyframes glance-c{0%,40%{transform:translateX(0) scaleY(1)}48%{transform:translateX(-2.6px) scaleY(1)}68%{transform:translateX(2.4px) scaleY(1)}86%{transform:translateX(0) scaleY(1)}90%{transform:translateX(0) scaleY(.1)}94%,100%{transform:translateX(0) scaleY(1)}}
@media (prefers-reduced-motion: reduce){.lantern *{animation:none !important}}

</style></head><body>
<svg viewBox="0 0 100 124" id="glim" class="lantern s-listen" width="240" height="298" aria-hidden="true">
<defs>
<radialGradient id="lg-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb347" stop-opacity="0.75"></stop><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"></stop></radialGradient>

<path class="tw tw2" transform="translate(112 60) scale(1.5)" d="M0 -6 L1.4 -1.4 L6 0 L1.4 1.4 L0 6 L-1.4 1.4 L-6 0 L-1.4 -1.4Z"></path>
<path class="tw tw3" transform="translate(-16 92)" d="M0 -6 L1.4 -1.4 L6 0 L1.4 1.4 L0 6 L-1.4 1.4 L-6 0 L-1.4 -1.4Z"></path>
<path class="tw tw4" transform="translate(98 -6) scale(0.9)" d="M0 -6 L1.4 -1.4 L6 0 L1.4 1.4 L0 6 L-1.4 1.4 L-6 0 L-1.4 -1.4Z"></path>
<circle class="mote" cx="18" cy="16" r="1.6"></circle>
<circle class="mote m2" cx="88" cy="108" r="1.4"></circle>
<circle class="mote m3" cx="114" cy="30" r="1.2"></circle>
<circle class="mote m2" cx="-4" cy="62" r="1.3"></circle>
</g>
<circle class="glow" cx="50" cy="64" r="58" fill="url(#lg-glow)"></circle>
<circle class="ring" cx="50" cy="64" r="44" fill="none" stroke="#ff3b30" stroke-width="2"></circle>
<g class="tone">
<ellipse class="body" cx="50" cy="64" rx="38" ry="34" fill="url(#lg-paper)" stroke="#ffcf6b" stroke-width="1.2"></ellipse>
<g class="ribs-h" clip-path="url(#lg-clip)" stroke="#d96f17" stroke-opacity="0.45" stroke-width="1.2" fill="none"><path d="M10 46 Q50 50 90 46"></path><path d="M10 58 Q50 62 90 58"></path><path d="M10 70 Q50 74 90 70"></path><path d="M10 82 Q50 86 90 82"></path></g>
<ellipse class="ribs-v" cx="50" cy="64" rx="21" ry="34" fill="none" stroke="#c2600f" stroke-width="2.4"></ellipse>
</g>
<g class="flame-g">
<circle class="inner" cx="50" cy="70" r="22" fill="url(#lg-inner)"></circle><path class="flame" d="M50 89 C40 89 34 82 34 71 C34 60 41 54 46 46 C48 43 48 39 46 36 C53 38 57 44 56 50 C59 48 61 45 61 42 C65 49 66 58 66 70 C66 82 59 89 50 89Z" fill="url(#lg-flame)"></path><ellipse class="core" cx="50" cy="76" rx="10" ry="9" fill="#ffffff" opacity="0.45"></ellipse>
<g class="eyes-wrap"><g class="eyes" fill="#3b2416"><ellipse class="eye" cx="43.5" cy="74" rx="3.2" ry="4.3"></ellipse><ellipse class="eye" cx="56.5" cy="74" rx="3.2" ry="4.3"></ellipse><circle class="hl" cx="44.5" cy="72.4" r="1.1"></circle><circle class="hl" cx="57.5" cy="72.4" r="1.1"></circle></g><g class="brows" fill="none" stroke="#3b2416" stroke-width="1.1" stroke-linecap="round"><path class="brow brow-l" d="M40.5 68 Q43.5 66.6 46.5 68"></path><path class="brow brow-r" d="M53.5 68 Q56.5 66.6 59.5 68"></path></g><g class="happy" fill="none" stroke="#3b2416" stroke-width="1.4" stroke-linecap="round"><path d="M40.6 74.5 Q43.5 71 46.4 74.5"></path><path d="M53.6 74.5 Q56.5 71 59.4 74.5"></path></g></g><g class="face"><path d="M48.2 80 Q50 82 51.8 80" fill="none" stroke="#3b2416" stroke-width="1.2" stroke-linecap="round"></path></g><g class="hands" fill="#fffbea" stroke="#e9a640" stroke-width="0.75"><g class="hand hand-l"><ellipse cx="32.2" cy="76.9" rx="1.05" ry="2.1" transform="rotate(-18 32.2 76.9)"></ellipse><ellipse cx="34" cy="76.3" rx="1.05" ry="2.2"></ellipse><ellipse cx="35.8" cy="76.9" rx="1.05" ry="2.1" transform="rotate(18 35.8 76.9)"></ellipse><ellipse cx="37.6" cy="79.4" rx="1" ry="1.9" transform="rotate(55 37.6 79.4)"></ellipse><circle cx="34" cy="80.2" r="3.2"></circle></g><g class="hand hand-r"><ellipse cx="64.2" cy="76.9" rx="1.05" ry="2.1" transform="rotate(-18 64.2 76.9)"></ellipse><ellipse cx="66" cy="76.3" rx="1.05" ry="2.2"></ellipse><ellipse cx="67.8" cy="76.9" rx="1.05" ry="2.1" transform="rotate(18 67.8 76.9)"></ellipse><ellipse cx="62.4" cy="79.4" rx="1" ry="1.9" transform="rotate(-55 62.4 79.4)"></ellipse><circle cx="66" cy="80.2" r="3.2"></circle></g></g>
</g>
<g class="embers" fill="#fff1b8"><circle cx="30" cy="58" r="1.6"></circle><circle cx="70" cy="62" r="1.4"></circle><circle cx="66" cy="48" r="1.1"></circle></g>

<rect x="32" y="95" width="36" height="10" rx="4" fill="#4c2f20" stroke="#9a6a48" stroke-width="1"></rect>
</g>
<path class="spark" d="M62 34 L63.5 38.5 L68 40 L63.5 41.5 L62 46 L60.5 41.5 L56 40 L60.5 38.5Z" fill="#fff4c2"></path>
<path class="lift" d="M50 15 L51.3 18.7 L55 20 L51.3 21.3 L50 25 L48.7 21.3 L45 20 L48.7 18.7Z" fill="#fff4c2"></path><path class="drop" d="M64 56 C64 56 60.6 60.4 60.6 62.6 C60.6 64.5 62.1 66 64 66 C65.9 66 67.4 64.5 67.4 62.6 C67.4 60.4 64 56 64 56Z" fill="#cfe9ff" stroke="#7fb4e0" stroke-width="0.6"></path>
</svg>
<div class="controls"><button onclick="setState('s-idle')">idle</button><button onclick="setState('s-listen')">listen</button><button onclick="setState('s-think')">think</button><button onclick="setState('s-suggest')">suggest</button><button onclick="setState('s-record')">record</button><button onclick="setState('s-paused')">paused</button><button onclick="setState('s-delegate')">delegate</button><button onclick="setState('s-done')">done</button><button onclick="setState('s-error')">error</button><button onclick="document.getElementById('glim').classList.toggle('compact')">toggle compact</button></div>
<script>
function setState(s){const el=document.getElementById('glim');el.classList.remove('s-idle','s-listen','s-think','s-suggest','s-record','s-paused','s-delegate','s-done','s-error');el.classList.add(s);}
</script>
</body></html>
