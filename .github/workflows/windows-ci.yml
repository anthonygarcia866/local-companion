name: Windows CI

# Type-checks and tests the Windows app on every pull request that touches it.
# Nothing is packed and nothing is published: releases stay in windows.yml,
# which only runs on tags.

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
      - 'ci/clippy-baseline.txt'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
      - 'ci/clippy-baseline.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tests run the TypeScript sources directly, which needs Node 22.18
      # or newer; 24 is the version they are run with locally.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-ci-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-ci-cargo-

      - name: Install dependencies
        run: npm ci

      # Dependency audits, report only: they never fail the job or block a
      # merge. Each prints its advisories and annotates the job with counts by
      # severity. Fixes are separate PRs, one upgrade each, on the owner's OK.
      - name: Install cargo-audit (prebuilt)
        if: always()
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit (report only)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $text = cargo audit --color never 2>&1 | Out-String
          $text
          $json = cargo audit --json 2>$null | Out-String
          try { $r = $json | ConvertFrom-Json } catch { "::warning title=cargo audit::could not run or parse cargo audit"; exit 0 }
          $sev = [ordered]@{ critical = 0; high = 0; medium = 0; low = 0; unrated = 0 }
          foreach ($m in [regex]::Matches($text, '(?m)^Severity:\s+[\d.]+\s+\((\w+)\)')) { $sev[$m.Groups[1].Value.ToLower()]++ }
          $vulns = [int]$r.vulnerabilities.count
          $sev.unrated = [Math]::Max(0, $vulns - ($sev.critical + $sev.high + $sev.medium + $sev.low))
          $warn = @()
          foreach ($p in $r.warnings.PSObject.Properties) { $warn += "$($p.Name) $(@($p.Value).Count)" }
          $sevText = ($sev.GetEnumerator() | ForEach-Object { "$($_.Key) $($_.Value)" }) -join ', '
          $summary = "$vulns vulnerabilities ($sevText); warnings: $(if ($warn) { $warn -join ', ' } else { 'none' })"
          "cargo audit: $summary"
          "### cargo audit: $summary" >> $env:GITHUB_STEP_SUMMARY
          if ($vulns -gt 0 -or $warn) { "::warning title=cargo audit::$summary" } else { "::notice title=cargo audit::$summary" }
          exit 0

      - name: npm audit, runtime deps (report only)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          npm audit --omit=dev 2>&1 | Out-Host
          $json = npm audit --omit=dev --json 2>$null | Out-String
          try { $m = ($json | ConvertFrom-Json).metadata.vulnerabilities } catch { "::warning title=npm audit::could not run or parse npm audit"; exit 0 }
          $summary = "$($m.total) vulnerabilities (critical $($m.critical), high $($m.high), moderate $($m.moderate), low $($m.low), info $($m.info))"
          "npm audit: $summary"
          "### npm audit (--omit=dev): $summary" >> $env:GITHUB_STEP_SUMMARY
          if ([int]$m.total -gt 0) { "::warning title=npm audit::$summary" } else { "::notice title=npm audit::$summary" }
          exit 0

      - name: Type check
        run: npx tsc --noEmit

      - name: Island tests
        run: npm test

      # The mascot in a real Chromium (headless Edge): pixels against the
      # approved design, and prefers-reduced-motion emulated.
      - name: Lantern check
        run: npm run check:lantern -- "$env:RUNNER_TEMP\lantern-check"

      - name: Keep the lantern check's images when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lantern-check
          path: ${{ runner.temp }}/lantern-check
          retention-days: 7

      # The app bundles target/release/glim-hook.exe as a resource, and its
      # build script refuses to run until that file exists. One command per
      # step: PowerShell carries on after a failed command in the same step.
      - name: Build the relay
        run: cargo build --release -p glim-hook

      - name: Rust tests
        run: cargo test --workspace --locked

      # Voice without a microphone (automated testing stage 4,
      # src/voice/e2e_tests.rs): Windows' SAPI voices make the clips (none
      # are kept in the repo), whisper.cpp b5454 + base.en (downloaded here,
      # SHA-256 checked) transcribes them through Glim's own code, then the
      # router runs with a fake executor that records actions and opens
      # nothing. Claude is live only when the GLIM_VOICE_API_KEY secret is set
      # (capped at about $0.01 a run); otherwise canned answers. The cost goes
      # to the job summary.
      - name: Voice clips (Windows SAPI)
        shell: pwsh
        run: ./scripts/voice-clips.ps1 -Out "$env:RUNNER_TEMP/voice-clips"

      - name: Cache whisper
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/whisper
          key: whisper-b5454-base-en-q5_1-v1

      - name: Fetch whisper (SHA-256 checked)
        shell: pwsh
        run: ./scripts/fetch-whisper.ps1 -Dir "$env:RUNNER_TEMP/whisper"

      - name: Voice end to end
        shell: pwsh
        env:
          GLIM_VOICE_API_KEY: ${{ secrets.GLIM_VOICE_API_KEY }}
        run: |
          $env:GLIM_VOICE_CLIPS = "$env:RUNNER_TEMP/voice-clips"
          $env:GLIM_WHISPER_DIR = "$env:RUNNER_TEMP/whisper"
          cargo test --workspace --locked voice::e2e_tests -- --ignored --nocapture

      # Tests must never create or change the user's data folders: Rust tests
      # get a scratch folder each (platform::data_base), the island tests touch
      # no files. A fresh runner has neither folder, so any here came from a test.
      - name: Tests left the real data folders alone
        shell: pwsh
        run: |
          $touched = @("$env:APPDATA\Glim", "$env:LOCALAPPDATA\Glim", "$env:APPDATA\Coucou", "$env:LOCALAPPDATA\Coucou") | Where-Object { Test-Path $_ }
          if ($touched) { Get-ChildItem $touched -Recurse -Force | Select-Object FullName; throw "tests created or changed: $($touched -join ', ')" }
          "no data folder was touched"

      # Clippy, report only: it never fails the job or blocks a merge. It runs
      # even when an earlier step failed, prints every distinct warning and the
      # count, and adds a warning annotation when the count is above the
      # baseline in ci/clippy-baseline.txt (how to lower it is written there).
      - name: Clippy (report only)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $baseline = [int](Get-Content ../ci/clippy-baseline.txt | Where-Object { $_.Trim() -and -not $_.TrimStart().StartsWith('#') } | Select-Object -First 1)
          rustup component add clippy 2>&1 | Out-Host
          $started = Get-Date
          $json = cargo clippy --workspace --all-targets --locked --message-format=json 2>$null
          $clippyExit = $LASTEXITCODE
          $seconds = [int]((Get-Date) - $started).TotalSeconds
          # The same warning shows up once per target (lib, lib test, ...): count it once.
          $warnings = @($json | Where-Object { $_.StartsWith('{') } | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-message' -and $_.message.level -eq 'warning' -and $_.message.spans.Count -gt 0 } |
            ForEach-Object { $_.message.rendered.TrimEnd() } | Sort-Object -Unique)
          $count = $warnings.Count
          $warnings | ForEach-Object { $_; '' }
          "clippy: $count distinct warning(s), baseline $baseline, exit $clippyExit, ${seconds}s"
          "### Clippy: $count warning(s) (baseline $baseline, ${seconds}s)" >> $env:GITHUB_STEP_SUMMARY
          if ($clippyExit -ne 0) {
            "::warning title=Clippy::cargo clippy exited $clippyExit (a compile error, or clippy missing); the count may be incomplete"
          }
          if ($count -gt $baseline) {
            "::warning title=Clippy::$count warnings, above the baseline of $baseline. Fix the new ones (see this step's log)."
          } elseif ($count -lt $baseline) {
            "Below the baseline: lower ci/clippy-baseline.txt to $count."
          }
          exit 0

  # Page tests (windows/e2e, playwright.config.mjs): Glim's real pages in
  # headless Edge (the runner's own Edge: the Chromium WebView2 runs; no
  # browser is downloaded) on localhost, with a stand-in for Tauri. Settings
  # sections, calendar/memory/routine lists, the approval cards and the Allow
  # key (#59), the voice cards. A console error fails a check. Screenshots of
  # every check are kept as the "page-tests" artifact. Runs beside `test`.
  pages:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Page tests
        shell: pwsh
        run: |
          $started = Get-Date
          npx playwright test
          $code = $LASTEXITCODE
          $seconds = [int]((Get-Date) - $started).TotalSeconds
          $shots = @(Get-ChildItem e2e-results/shots -Filter *.png -ErrorAction SilentlyContinue).Count
          "### Page tests: exit $code, $shots screenshots, ${seconds}s" >> $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: page-tests
          path: windows/e2e-results
          retention-days: 14
