<!doctype html>
<!-- Glim approvals (owner 2026-11-21, docs/remote-runbooks.md §8).

     fresh-agent security review finding nothing critical or high (CLAUDE.md,

  <meta name="referrer" content="no-referrer">
  <title>Glim approvals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Glim approvals</h1>
    <section id="view" aria-live="polite"></section>
    <p class="small">Glim's approval page. It asks your passkey (Face ID) to unlock a request and, if you approve, to sign exactly what it shows. Glim on your PC checks that signature.</p>
  </main>
  <script src="approve.js"></script>
</body>
</html>
